name: Check Exact Preview Release

on:
  pull_request:
    paths:
      - '.github/workflows/preview-release-check.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Preview release tag in this repository
        type: string
        required: true
      full_atm:
        description: Test the exact packages with the pinned full ATM10 catalog on every platform
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-release:
    if: github.event_name == 'workflow_dispatch'
    # GitHub exposes draft releases only with push access. All commands remain read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            package: windows-x64
            executable: Mineways.exe
          - runner: macos-26-intel
            platform: macos-x86_64
            package: macos-universal
            executable: Mineways.app/Contents/MacOS/mineways
            architecture: x86_64
          - runner: macos-26
            platform: macos-arm64
            package: macos-universal
            executable: Mineways.app/Contents/MacOS/mineways
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PREVIEW_ARCHIVE: Mineways-preview-${{ matrix.package }}.zip
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test showcase tooling
        shell: bash
        run: |
          python tools/test_atm10_showcase_generator.py
          python tools/test_prepare_atm10_showcase.py
          python tools/test_showcase_launchers.py
          python tools/test_atm10_showcase.py --self-test
      - name: Download exact release assets from this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$PREVIEW_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PREVIEW_ARCHIVE" --pattern SHA256SUMS.txt --dir downloaded
      - name: Verify ZIP checksum and report build metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import zipfile
          directory = Path('downloaded')
          archive = directory / os.environ['PREVIEW_ARCHIVE']
          entries = [line.split('  ', 1) for line in (directory / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          matches = [checksum for checksum, name in entries if name == archive.name]
          if len(matches) != 1 or hashlib.sha256(archive.read_bytes()).hexdigest() != matches[0]:
              raise SystemExit('Release ZIP does not match SHA256SUMS.txt')
          with zipfile.ZipFile(archive) as package:
              metadata_files = [name for name in package.namelist() if name.endswith('/BUILD-METADATA.json')]
              if len(metadata_files) != 1:
                  raise SystemExit('Expected exactly one build metadata file')
              metadata = json.loads(package.read(metadata_files[0]))
              if metadata['source_revision'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('The package source revision differs from the workflow checkout')
              print(json.dumps(metadata, indent=2))
          print('Exact release ZIP checksum verified:', archive.name)
          PY
      - name: Verify native macOS test runner
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          python -c 'import platform; assert platform.machine() == "${{ matrix.architecture }}"'
      - name: Test exact downloaded package
        shell: bash
        run: python tools/test_preview_package.py "downloaded/$PREVIEW_ARCHIVE" --output preview-test
      - name: Test Windows GUI startup and map
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test_preview_windows_gui.ps1 -PackageRoot "preview-test/extracted preview with spaces/Mineways-preview-windows-x64" -Screenshot "preview-test/windows-gui.png"
      - name: Prepare showcase through the shipped Windows launcher without system Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = (Resolve-Path -LiteralPath 'preview-test/extracted preview with spaces/Mineways-preview-windows-x64').Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$package/Open ATM10 Showcase.cmd" --prepare-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          & "$package/Open ATM10 Showcase.cmd" --prepare-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare showcase through the shipped native Mac launcher without system Python
        if: runner.os == 'macOS'
        shell: bash
        run: |
          launcher="$PWD/preview-test/extracted preview with spaces/Mineways-preview-macos-universal/Open ATM10 Showcase.command"
          PATH=/usr/bin:/bin:/usr/sbin:/sbin "$launcher" --prepare-only
          HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 PATH=/usr/bin:/bin:/usr/sbin:/sbin "$launcher" --prepare-only
      - name: Test shipped ATM10 showcase exports and schematics
        shell: bash
        run: python tools/test_atm10_showcase.py "preview-test/extracted preview with spaces/Mineways-preview-${{ matrix.package }}" --output showcase-test
      - name: Test the Windows showcase launcher opens the GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test_preview_windows_gui.ps1 -PackageRoot "preview-test/extracted preview with spaces/Mineways-preview-windows-x64" -Screenshot "preview-test/showcase-gui.png" -Atm10Showcase
      - name: Test real Fabric and NeoForge packs through packaged launcher helpers
        shell: bash
        run: |
          python tools/test_launcher_real_packs.py --self-test
          python tools/test_launcher_real_packs.py "preview-test/extracted preview with spaces/Mineways-preview-${{ matrix.package }}" --output real-launcher-packs
      - name: Test exact package with full ATM10 catalog
        if: inputs.full_atm
        shell: bash
        run: |
          preview_package="preview-test/extracted preview with spaces/Mineways-preview-${{ matrix.package }}"
          python tools/download_mod_assets.py tools/fixtures/atm10-1.21.1.json "$RUNNER_TEMP/atm10-assets"
          python -I "$preview_package/tools/import_mod_assets.py" --sources-file "$RUNNER_TEMP/atm10-assets/sources.txt" -o "$RUNNER_TEMP/atm10-pack"
          python tools/test_mod_windows.py "$preview_package/${{ matrix.executable }}" --pack "$RUNNER_TEMP/atm10-pack/manifest.mwpack" --pack-only
      - name: Save release smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-${{ matrix.platform }}
          path: |
            preview-test/**/smoke output/**
            preview-test/windows-gui.png
            preview-test/showcase-gui.png
            showcase-test/validation.json
            real-launcher-packs/validation.json
            real-launcher-packs/**/installation.json
            real-launcher-packs/**/*.log
          if-no-files-found: warn
